<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>voice-to-app</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="shell">
      <p class="eyebrow">VOICE-TO-APP / STAGE 1</p>
      <h1>Say the app you want to build.</h1>
      <p class="lede">Record an idea, review the structured product spec, then decide whether to build it.</p>
      <section class="panel recorder" aria-labelledby="record-heading">
        <h2 id="record-heading">Describe your app</h2>
        <button id="recordButton" class="record" type="button"><span></span> Record</button>
        <p id="status" role="status">Ready to listen.</p>
        <label for="transcript">Transcript</label>
        <textarea id="transcript" rows="5" placeholder="Your spoken description will appear here. You can also type it."></textarea>
        <button id="parseButton" class="primary" type="button">Turn into a spec</button>
      </section>
      <section id="result" class="panel result" hidden aria-live="polite"></section>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
